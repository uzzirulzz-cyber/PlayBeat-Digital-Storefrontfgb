kind = "web"
previewPath = "/"
title = "PlayBeat Digital"
description = "A premium digital marketplace for subscriptions, software, gift cards, gaming, business solutions, and smart projectors, with PKR pricing, product discovery, and a persistent customer cart."
version = "1.0.0"
id = "artifacts/playbeat-storefront"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24752

[services.development]
run = "pnpm --filter @workspace/playbeat-storefront run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/playbeat-storefront", "run", "build" ]
serve = "static"
publicDir = "artifacts/playbeat-storefront/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24752"
BASE_PATH = "/"
